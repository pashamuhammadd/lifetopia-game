<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#377F55">
    <link rel="icon" href="data:,">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #377F55; }
      /* Full-window canvas; touch-action none stops the browser from panning/zooming while using the joystick. */
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none;
                      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; background: #377F55; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 14px; font-family: system-ui, sans-serif; color: #FFF3D8; }
      #loading-bar { width: min(60vw, 320px); height: 10px; border-radius: 5px; background: rgba(255, 243, 216, 0.25); overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: #FFF3D8; }
      #message { position: fixed; left: 0; right: 0; top: 0; padding: 12px 16px; font-family: system-ui, sans-serif;
                 color: #fff; background: #B3402F; display: none; z-index: 2; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div>Loading Lifetopia World…</div><div id="loading-bar"><div id="loading-fill"></div></div></div>
    <div id="message" role="alert"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var message = document.querySelector("#message");

      function showBanner(text, type) {
        if (type === "error") { message.textContent = text; message.style.display = "block"; }
        else { console.warn(text); }
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Cap render resolution on very high-density phone screens (performance).
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: showBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#loading-fill").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (err) {
          showBanner(String(err), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
