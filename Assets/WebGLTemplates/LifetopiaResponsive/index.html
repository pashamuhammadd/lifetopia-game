<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#377F55">
    <meta name="generator" content="LifetopiaResponsive">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Lifetopia World</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #377F55; }
      /* Full-window canvas; touch-action none stops the browser from panning/zooming while using the joystick. */
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none;
                      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; background: #377F55; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 14px; font-family: system-ui, sans-serif; color: #FFF3D8; }
      #loading-bar { width: min(60vw, 320px); height: 10px; border-radius: 5px; background: rgba(255, 243, 216, 0.25); overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: #FFF3D8; }
      #message { position: fixed; left: 0; right: 0; top: 0; padding: 12px 16px; font-family: system-ui, sans-serif;
                 color: #fff; background: #B3402F; display: none; z-index: 2; }
      /* Portrait on touch devices: ask to rotate. Covers the canvas so no stray touches reach the game. */
      #rotate { position: fixed; inset: 0; z-index: 3; display: none; flex-direction: column; align-items: center;
                justify-content: center; gap: 12px; padding: 24px; text-align: center; background: #377F55;
                color: #FFF3D8; font-family: system-ui, sans-serif; touch-action: none; }
      #rotate .icon { width: 56px; height: 88px; border: 4px solid #FFF3D8; border-radius: 12px;
                      animation: lt-rotate 2.4s ease-in-out infinite; }
      #rotate .title { font-size: 20px; font-weight: 600; }
      #rotate .hint { font-size: 14px; opacity: 0.85; }
      @keyframes lt-rotate { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate .icon { animation: none; transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      /* Build information (filled from version.json written by Tools/Build-Web.ps1). Text only, never captures input. */
      #build-info { font-size: 12px; line-height: 1.5; text-align: center; opacity: 0.85; min-height: 36px; }
      #build-info .name { font-weight: 600; letter-spacing: 0.02em; }
      #build-badge { position: fixed; z-index: 1; display: none; pointer-events: none; user-select: none;
                     right: calc(6px + env(safe-area-inset-right)); bottom: calc(3px + env(safe-area-inset-bottom));
                     font: 10px/1.2 system-ui, sans-serif; color: #FFF3D8; opacity: 0.55;
                     text-shadow: 0 1px 2px rgba(60, 40, 20, 0.6); }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div>Loading Lifetopia World…</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="build-info" aria-live="polite"></div>
    </div>
    <div id="build-badge" aria-hidden="true"></div>
    <div id="message" role="alert"></div>
    <div id="rotate" role="status" aria-live="polite">
      <div class="icon" aria-hidden="true"></div>
      <div class="title">Please rotate your device</div>
      <div class="hint">Lifetopia World plays in landscape mode.</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var message = document.querySelector("#message");

      function showBanner(text, type) {
        if (type === "error") { message.textContent = text; message.style.display = "block"; }
        else { console.warn(text); }
      }

      // Optional build information. Missing or invalid version.json simply shows nothing.
      function showBuildInfo(v) {
        var lines = [
          '<div class="name">Lifetopia World</div>',
          '<div>' + esc(v.channel || "Development Build") + ' &middot; v' + esc(v.version || "?") + ' &middot; ' + esc(v.milestone || "?") + '</div>',
          '<div>Built ' + esc((v.buildDate || "").slice(0, 10)) + '</div>'
        ];
        document.querySelector("#build-info").innerHTML = lines.join("");
        var badge = document.querySelector("#build-badge");
        badge.textContent = "Dev Build v" + (v.version || "?") + " · " + (v.milestone || "?") + " · " + (v.buildDate || "").slice(0, 10);
      }
      function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
      fetch("version.json", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) { if (v) showBuildInfo(v); })
        .catch(function () { });

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Cap render resolution on very high-density phone screens (performance).
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: showBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#loading-fill").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          document.querySelector("#loading").style.display = "none";
          var badge = document.querySelector("#build-badge");
          if (badge.textContent) badge.style.display = "block";
          canvas.focus();
        }).catch(function (err) {
          showBanner(String(err), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
